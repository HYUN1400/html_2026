<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shop</title>
    <style>
        @font-face {
            font-family: HeirofLightBold;
            src: url(../resource/font/HeirofLightBold.ttf);
        }

        @font-face {
            font-family: HeirofLightRegular;
            src: url(../resource/font/HeirofLightRegular.ttf);
        }

        body {
            margin: 0px;
            background-image: url(../resource/giphy.gif), url(../resource/hollow-knight-bg.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            overflow-x: hidden;
            background-blend-mode: screen;
        }

        .header {
            display: flex;
            height: 15vh;
            box-sizing: border-box;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            height: 100%;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .logo-img {
            height: 80%;
            width: auto;
            object-fit: contain;
            margin: 10px 0px 0px 20px;
        }

        .menu {
            display: flex;
            gap: 20px;
            padding-right: 30px;
            font-family: HeirofLightBold;
            font-size: 18px;
        }

        .menu > a {
            text-decoration: none;
            color: white;
        }

        .menu > a:hover {
            text-shadow: 1px -1px 5px white;
        }

        .body {
            min-height: 75vh; 
            height: auto;     
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 100px;
            padding: 50px 0; 
        }

        .main-img {
            background-image: url(../resource/hollowknight.JPG);
            min-width: 100%;
            height: 500px;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            transition: 0.4s ease;

            box-shadow: 5px 0px 15px rgba(255, 255, 255, 0.5);
        }

        .main-img:hover {
            filter: grayscale();
            transition: 1s;
        }

        .new {
            font-family: HeirofLightBold;
            font-size: 30px;
            color: white;
            text-shadow: 0px 0px 5px rgba(255, 255, 255, 0.5);
        }

        .product {
            height: 60%;
            display: grid;
            grid-template-columns: repeat(3, 200px);
            justify-items: center;
            align-items: center;
            gap: 50px;
        }

        .product > div {
            display: flex;
            flex-direction: column;
            height: auto;
            width: 200px;
            box-sizing: border-box;      
        }

        .product > div > img {
            height: 200px;
            width: 100%;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.8);
            border: 1px solid rgb(166, 233, 241);
            
            transition: 0.5s ease;
        }

        .product > div > img:hover {
            box-shadow: 0px 0px 15px rgba(255, 255, 255, 0.8);
            scale: calc(1.1);
            transition: 0.5s;
        }

        .product > div > span {
            color: white;
            font-family: HeirofLightbold;
            font-size: 18px;
            text-align: center;
            text-shadow: 0px 0px 15px rgba(0, 0, 0, 0.8);
        }

        .footer {
            min-height: 10vh; 
            height: auto;
            margin-top: 50px;

            display: flex;
            justify-content: center;
            gap: 50px;
        }

        .footer > svg {
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container" onclick="location.href=''">
                <img src="../resource/logo_main.png" alt="" class="logo-img">
            </div>
            <div class="menu">
                <a href="">CONTENT</a>
                <a href="">SHOP</a>
                <a href="">CART</a>
                <a href="">LOGIN</a>

        </div>
        <div class="body">

            <span class="new">NEW ARRIVAL</span>

            <div class="product">

                </div>
                <div class="item2">

                    <span>HOLLOW PLUSH</span>
                    <span>$55</span>
                </div>
                <div class="item3">
                    <img src="../resource/hollowknight_3.JPG" alt="">
                    <span>VOID PLUSH</span>
                    <span>$55</span>
                </div>
                <div class="item4">
                    <img src="../resource/hollowknight_4.JPG" alt="">
                    <span>QUIRREL PLUSH</span>
                    <span>$55</span>
                </div>
                <div class="item5">
                    <img src="../resource/hollowknight_5.JPG" alt="">
                    <span>MINI FIGURE</span>
                    <span>$55</span>
                </div>
                <div class="item6">
                    <img src="../resource/hollowknight_6.JPG" alt="">
                    <span>SOUNDTRACK LP</span>
                    <span>$55</span>
                </div>
                <div class="item7">
                    <img src="../resource/hollowknight_7.JPG" alt="">
                    <span>PIN</span>
                    <span>$55</span>
                </div>
                <div class="item8">
                    <img src="../resource/hollowknight_8.JPG" alt="">
                    <span>JOURNALS</span>
                    <span>$55</span>
                </div>
                <div class="item9">
                    <img src="../resource/hollowknight_9.JPG" alt="">
                    <span>KNIGHT PLUSH</span>
                    <span>$55</span>
                </div>
            </div>
        </div>
