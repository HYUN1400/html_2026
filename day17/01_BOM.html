<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOM</title>
</head>
<body>
    <h1>BOM(Browser Object Model)</h1>
    <h4>: 브라우저 객체를 지칭하는 용어 (window 객체)</h4>
    <h1>DOM(Document Object Model)</h1>
    <h4>: 문서 객체를 지칭하는 용어 (HTML 안에 입력된 객체)</h4>

    <hr>

    <ul>
        <li id="ih">
            window.innerHeight: 화면의 툴바를 제외한 안쪽 높이 => 
        </li>
        <li id="iw">
            window.innerWidth: 화면의 스크롤바를 포함한 너비 => 
        </li>
        <li>
            윈도우 종류, 브라우저 종류, 모니터 화면 배율 등에 따라 달라짐.
        </li>
    </ul>

    <script>
        const ih = document.querySelector("#ih");
        const iw = document.querySelector("#iw");

        ih.innerText += window.innerHeight;
        iw.innerText += window.innerWidth;
    </script>
</body>
</html>
