<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DomEx01</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap');

        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;1,500&display=swap');

        
        /* light mode */

        body {
            letter-spacing: -0.04em;
            position: relative;

            transition: 0.2s ease;
            background-color: rgb(245, 245, 245);
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 20px;

            margin-top: 30px;
        }

        .title {
            box-sizing: border-box;
            width: 350px;
            height: 60px;
            line-height: 60px;
            text-align: center;
            
            font-family: "Archivo Black";
            font-size: 32px;
            font-weight: 900;
            color: rgb(255, 255, 255);

            text-shadow: -1px -1px 3px rgb(179, 77, 9);

            background: linear-gradient(to right, #CE796E, rgb(255, 224, 192));

            box-shadow: 2px 2px 5px #efccab, -2px -2px 5px #ffffff;

            border-radius: 15px 15px 0px 15px;
        }

        .menu {
            font-family: "Montserrat";
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 70px;
            font-size: 14px;

            color:#CE796E;
        }

        .menu > div:nth-of-type(1) {
            background: linear-gradient(to right, #CE796E);

            color: white;
            padding: 2px 10px;
            border-radius: 5px;
        }

        .menu > div{
            transition: 0.2s ease;
        }

        .menu > div:hover{
            cursor: pointer;
            scale: calc(1.1);
        }

        .imageBox {
            width: 100%;
            height: 300px;
            background-color: aliceblue;
        }

        .image {
            width: 100%;
            height: 300px;
            background-size: cover;
            background-position: center;

            border: 2px solid rgb(227, 114, 0);

            transition: filter 0.4s ease;
        }

        .image.home{
            background-image: url(../resource/travel.jpg);
        }

        .image.seoul{
            background-image: url(../resource/seoul.jpg)
        }

        .image.tokyo{
            background-image: url(../resource/tokyo.jpg);
        }

        .image.paris{
            background-image: url(../resource/paris.jpg);
        }

        .image:hover{
            filter: grayscale();
        }

        .toggle{
            position: absolute;
            width: 30px;
            height: 30px;

            top: 10px;
            right: 20px;

            text-align: center;
            line-height: 31px;

            border-radius: 50px;

            background-color: rgba(255,255,255,0.7);

            box-shadow: 2px 2px 5px #cfcfcf, -2px -2px 5px #ffffff;

            transition: 0.2s ease;
        }

        .toggle:hover{
            background-color: #feeddd;
            cursor: pointer;
        }

        .line {
            width: 100%;
            height: 1px;
            background-color: rgb(227, 114, 0);
        }


        /* dark mode */

        body.dark {
            background-color: rgb(46, 49, 59);
        }

        body.dark .title {
            color: rgb(46, 49, 59);

            text-shadow: -1px -1px 2px rgb(5, 125, 152);

            background: linear-gradient(to right, #6EC3CE,rgb(20, 145, 173));

            box-shadow: 2px 2px 8px rgba(255,255,255,0.3)
        }

        body.dark .menu {
            color: white;
        }

        body.dark .menu > div:nth-of-type(1){
            background: linear-gradient(to right, #6EC3CE,rgb(20, 145, 173));
            color: rgb(46, 49, 59);
        }

        body.dark .image {
            border: 2px solid rgb(5, 125, 152);
            box-shadow: 2px 2px 8px rgba(255,255,255,0.3)
        }

        body.dark .line {
            background-color: rgb(5, 125, 152);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="toggle" onclick="onClickMode()">🌗</div>
        <div class="title">TRAVEL</div>
        <div class="menu">
            <div class="home" onclick="onClickImage('home')">HOME</div>
            <div class="seoul" onclick="onClickImage('seoul')">SEOUL</div>
            <div class="tokyo" onclick="onClickImage('tokyo')">TOKYO</div>
            <div class="paris" onclick="onClickImage('paris')">PARIS</div>
        </div>
        <div class="line"></div>
        <div class="imageBox">
            <div class="image home"></div>
        </div>
    </div>

    <script>
        const image = document.querySelector(".image");
        const toggleBtn = document.querySelector(".toggle");
        const body = document.querySelector("body");

        const onClickImage = (mode) => {
            image.className = `image ${mode}`;
        }

        const onClickMode = () => {
            body.classList.toggle("dark")
        }
    </script>
</body>
</html>
