<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    <style>
        .light{
            background-color: rgb(240, 240, 240);
            padding: 10px;
            color: rgb(51, 150, 255);
        }
        .dark{
            background-color: black;
            padding: 10px;
            color: white;
        }
    </style>
</head>
<body>
    <h1>DOM: Document Object Model</h1>
    <!-- 
        html 하위에 있는 모든 태그 > element
        element가 가지고 있는 속성: attribute
        
        classList : element 속성 중 복수로 값을 가지는 속성
        - 객체에서 제고하는 별도의 메서드를 사용할 수 있음.
        add(): 클래스 추가
        remove() : 클래스 삭제
        contains() : 해당 클래스를 포함하는지 확인
        toggle() : 토글(해당 클래스가 있으면 삭제, 없으면 추가)
    -->
    <h2 class="text">
        색상변경
    </h2>
    <input type="color" id="colorvalue">
    <button id="changeBtn">change</button>

    <script>
        const changeBtn = document.querySelector("#changeBtn")
        const color = document.querySelector("#colorvalue");
        const text = document.querySelector("h2");

        changeBtn.addEventListener('click', () => {
            text.style.color = `${color.value}`
        })

        
    </script>
</body>
</html>
