<body>

    <script>
        const div = document.querySelector("div");
        const posterUrl = "https://image.tmdb.org/t/p/";

        const options = {
            method: 'GET',
            headers: {
                accept: 'application/json',
                Authorization: 'Bearer eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIxYjExN2NlZmMwY2Y0YWQ0ZGUwMzA4MDA3MzlmY2U0YiIsIm5iZiI6MTc3OTc2MDUwOC45MDQsInN1YiI6IjZhMTRmZDdjODdjZTExYjc4OTQwZTNkNiIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.h09fsP3yiOtN0WcPdjzEQVEuoSheGw8oxt-aUMLUGFU'
            }
            };

            fetch('https://api.themoviedb.org/3/movie/now_playing?language=ko-KR&page=1&region=KR', options)
            .then(res => res.json())
            .then(res => res.results)
            .then(res => 
                res.map((r) => {
                    div.innerHTML += `<div>${r.title}</div>`
                    div.innerHTML += `<div><img src ="${posterUrl}w300/${r.poster_path}"></img></div>`
                }))
            .catch(err => console.error(err));
    </script>
