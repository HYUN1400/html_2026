<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./05_calcStyle.css">
    <title>calc</title>
</head>
<body>
    <div class="container">
        <h1 class="printResult">0</h1>
        <div class="area">
            <button type="button" onclick="onClickNum(7)">7</button>
            <button type="button" onclick="onClickNum(8)">8</button>
            <button type="button" onclick="onClickNum(9)">9</button>
            <button type="button" onclick="onClickNum('+')">+</button>

            <button type="button" onclick="onClickNum(4)">4</button>
            <button type="button" onclick="onClickNum(5)">5</button>
            <button type="button" onclick="onClickNum(6)">6</button>
            <button type="button" onclick="onClickNum('-')">-</button>

            <button type="button" onclick="onClickNum(1)">1</button>
            <button type="button" onclick="onClickNum(2)">2</button>
            <button type="button" onclick="onClickNum(3)">3</button>
            <button type="button" onclick="onClickNum('*')">×</button>

            <button type="button" onclick="onClickNum('.')">.</button>
            <button type="button" onclick="onClickNum(0)">0</button>
            <button type="button" onclick="onClickCalc()" class="result">=</button>
            <button type="button" onclick="onClickNum('/')">÷</button>

            <button type="button" class="reset" onclick="resetOnClick()">C</button>
        </div>
    </div>

    <script src="./05_calcScript.js"></script>
</body>
</html>
