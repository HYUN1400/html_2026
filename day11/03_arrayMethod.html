<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arrayMethod</title>
</head>
<body>
    <h1>
        배열 관련 메서드
    </h1>
    <h1>
        유사 배열
    </h1>
    <!-- 
        []
        - 유사배열(HTMLCollection / NodeList)
        - 혼합배열 myArray = [1, 2, 3, 'a', 'b', 'c', [1, 2, 3] ...];
        - 유사배열 및 혼합배열에서는 사용이 제한되는 메서드도 있음.
    -->
    <!-- 
        - array.push(value) : 배열의 마지막 위치에 value 추가
            => 배열 길이를 리턴
        - array.unshift(value) : 배열의 첫번째 자리에 value 추가
            => 배열 길이를 리턴
        - array. pop() : 배열의 마지막 요소를 제거
            => 제거한 요소를 리턴
        - array.shift() : 배열의 첫번째 요소를 제거
            => 제거한 요소를 리턴
        - array.join(value) : 배열의 값에 특별한 value를 추가하여 하나의 문자열로 리턴
            => 1 2 3 array.join(",") => "1,2,3" 
    -->

    <script>
        const h1 = document.getElementsByTagName("h1");
        console.log(h1);

        const h = document.querySelectorAll("h1");
        console.log(h);

        let str = 'apple, banana, kiwi';
        let array = str.split(', ');

        console.log(array);
        console.log(array.join("/"));

        console.log("----------------------------------")
        array.push("orange");
        console.log(array);

        //shift 배열의 첫요소 제거
        console.log(array.shift());

        // unshift(value)
        console.log(array.unshift("peach"));
        console.log(array);

        // 일반적으로 빈배열을 만들어두고, 하나씩 추가하여 사용
        const arr1 = [];

    </script>
</body>
</html>
