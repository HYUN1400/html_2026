<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sort</title>
</head>
<body>
    <h1>SORT</h1>
    <!-- 
        array.sort() : 문자기준 오름차순 정렬(ascending)
        array.reverse() : 내림차순 정렬 (descending)
        - 정렬할 배열의 원소가 숫자일 경우 콜백함수를 이용하여 내부 연산기법을 이용
            => array.sort(function(a, b){return a - b}) : 오름차순
            => array.sort(function(a, b){return b - a}) : 내림차순
    -->

    <script>
        const numArr = [1, 3, 3, 2, 5, 9, 7, 6];
        const strArr = ['t', 'o', 'm', 'h', 'o', 'l'];

        // console.log(numArr.sort());
        // console.log(numArr.reverse());
        // console.log(strArr.sort());
        // console.log(strArr.reverse());


        numArr.sort(function(a, b){return a - b});
        console.log(numArr);

        numArr.sort(function(a, b){return b - a});
        console.log(numArr);

        const cars = [
            {   
                type: 'Volvo',
                year: 2025
            },
            {   
                type: 'BMW',
                year: 2023
            },
            {   
                type: 'BENZ',
                year: 2026
            }
        ]

        // 연도 기준으로 정렬
        const years = cars.sort((a, b) => b.year - a.year);
        console.log(years);

        // type 기준으로 오름차순
        // a.localeCompare(b)
        const result2 = cars.sort((a, b) => {
            return a.type.localeCompare(b.type);
        });
        console.log(result2);

        // myArr 배열을 생성하여 1~100 범위의 랜덤수를 6개 생성하여 저장 => 출력
        // 오름차순 정렬 = > 출력

        const myArr = [];
        for(let i=0; i < 6; i++){
            myArr.push(Math.floor(Math.random() * 100) + 1);
        }
        console.log(myArr);
        console.log(myArr.sort());

        // 이름순으로 오름차순 => 출력
        // 나이순으로 내림차순 => 출력
        const user = [
            {
                name: '홍길동',
                age: 40
            },
            {
                name: '봉미선',
                age: 30
            },
            {
                name: '짱구',
                age: 15
            },
            {
                name: '이순신',
                age: 50
            }
        ]

        const names = user.sort((a, b) => a.name.localeCompare(b.name));
        console.log(names);

        const ages = user.sort((a, b) => b.age - a.age);
        console.log(ages);

    </script>
</body>
</html>
