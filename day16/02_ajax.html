    <h4>: 비동기 통신 방식</h4>
    <!-- 
        ajax(Asynchronous javaScript and XML) 
        -   자바스크립트에 내장되어 있는 XMLHttpRequest(예전) / Fetch API(현재)
            객체를 활용하여 다른 서버에 있는 데이터를 요청하고 응답받은 데이터를
            자바스크립트로 처리 => 페이지 갱신 

            화면 <-> 서버
        
        - 데이터 통신 방식: 동기, 비동기
        
        동기식(synchronous) : 직렬식 (순차처리)
        - 동시에 일어나는 요청이 있을 시 바로 응답을 받는 방식
        - 순차적
        - 요청을 하면 html 페이지로 리턴
        - <form action = ""> </form>
        - 직관적, 설계가 간단.

        비동기식(Asynchronous) : 병렬식 (독립처리)
        - 특정 작업이 완료 될 때까지 기다리지 않고 다음 작업을 바로 실행
        - 각자 독립적
        - 요청에 대한 응답이 객체로 리턴
        - 설계가 복잡함.
        장점: 자원 활용이 효율적
        단점: 작업의 복잡성이 증가
        > ajax, jquery $.ajax

        async function => 비동기 통신 함수
        => promise 객체로 리턴

        await : 순차 처리가 진행되어야 할 때 사용
        => 순차 코드 실행 시 지연로딩, 지연 실행 상황이 발생하면 코드를 순차적으로
            진행할 수 있도록 보증하는 키워드

        contentType: 클라이언트와 서버간의 데이터 형식을 지정하는 헤더 정보
        - 응답 데이터가 어떤 데이터인지 알려주는 역할
        - application / json
        - text/plain
        - multipart / form-data
        - text / html
        - application / x-www-form-urlencoded
    -->
