<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>closure</title>
</head>
<body>
    <h1>closure(클로저)</h1>
    <h4>: 함수와 그 함수가 선언될 당시의 렉시컬 환경을 기억하고
        그 스코프에 있는 변수에 접근할 수 있는 함수
    </h4>
    <!-- 
        렉시컬 환경: 함수가 선언될 때 선언된 시점에서 외부 스코프와 변수들을 기억하는 환경

        <클로저>
        - 이전 상태를 기억하기 위해 사용
        - 전역 변수는 언제든지 누구나 접근 및 변경이 가능 => 다른 js 파일들에 의한 변경이 생길 수 있음

        - 데이터 은닉: 외부 변수에 직접 접근을 막고, 특정 함수를 통해서만 접근할 수 있게 하여 데이터를 보호
        - 상태유지: 콜백 함수나 이벤트 핸들러에 의해서 데이터를 안전하게 보관하고 재사용
    -->

    <button class="toggle">toggle</button>
    <div class="box" style="width: 100px; height: 100px; background-color: lightblue;"></div>

    <script>
        // display: none; <-> display: block;
        const box = document.querySelector(".box");
        const toggleBtn = document.querySelector(".toggle");

        const closure = () => {
            let isShow = false;

            return function(){
                box.style.display = isShow ? 'block' : 'none';
                isShow = !isShow;
            }
        }

        let toggle = closure(); // closure 반환

        // 이벤트 할당
        toggleBtn.addEventListener('click', toggle);

        console.log(toggle);
    </script>

    <button id="counter">counter</button>
    <h3 id="result"></h3>

    <script>
        const result = document.querySelector("#result");
        const countBtn = document.querySelector("#counter")

        const outer = () => {
            let count = 0;
            return function(){
                count ++;
                result.innerText = count;
            }
        }

        let counter = outer();
        countBtn.addEventListener('click', counter);
    </script>

    <h1 class="print"></h1>
    <button class="plusBtn">PLUS</button>
    <button class="minusBtn"">MINUS</button>

    <script>
        const print = document.querySelector(".print");
        const plusBtn = document.querySelector(".plusBtn");
        const minusBtn = document.querySelector(".minusBtn");

        const outerCalc = () => {
            let count = 0;
            return inner = (fluc) => {
                if(fluc === 'plus'){
                    count ++;
                } else if(fluc == 'minus') {
                    count --;
                }
                print.innerText = count;
            }
        }

        let calc = outerCalc();

        plusBtn.addEventListener('click', () => calc('plus'));
        minusBtn.addEventListener('click', () => calc('minus'));
    </script>
</body>
</html>
