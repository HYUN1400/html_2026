<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>promiseChain</title>
        <style>
        ul {
            list-style: none;
            padding: 10px;
        }

        li {
            margin-bottom: 10px;
            padding-bottom: 5px;
            letter-spacing: -0.03em;
            border-bottom: 1px solid pink;
        }

        li::before {
            content: '■';
            color: pink;
            font-size: 11px;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <h1>promise chain 방식</h1>
    <!-- 
        promise 객체를 리턴하여 값을 가져오면
        then 메서드를 실행하여 실행 순서를 기다리게 할 수 있음.

        fetch(url, [config]) : 데이터 통신을 위해 제공하는 함수
        config(header에 적용되는 각종 정보를 설정)
        - method: post, put, delete
        - content-type: 보내는 객체 데이터 타입
        
        then: promise 객체를 연결, 프로미스 객체를 리턴하는 함수
        - 메서드를 기다리고 리턴값이 만들어지면 다음 로직을 수행할 수 있도록 연결
        
        https://jsonplaceholder.typicode.com/todos/1
        /comments?postId=1
    -->

    <button id="btn">데이터 가져오기</button>
    <ul id="ul">

    </ul>

    <script>
        const btn = document.querySelector("#btn");
        const ul = document.querySelector("#ul");

        btn.addEventListener('click', async () => {
            await fetch ('https://jsonplaceholder.typicode.com/todos')
            .then(res => res.json())
            .then(re => trueTodos(re))
            .catch(error => console.log(error))
        })

        const trueTodos = (re) => {
            const trues = re.filter((r) => r.completed).map((r) => `<li>${r.title}</li>`).join("");
            ul.innerHTML = trues;
        }

    </script>
</body>
</html>
