<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>regExp</title>
</head>
<body>
    <h1>
        정규표현식 (Regular Expression) RegEx / RegExp
    </h1>
    <!-- 
        정규표현식: 문자 내에서 특정 내용을 찾거나, 대체, 발췌하기 위해 사용
        - RegEx / RegExp 
        - 특정 데이터를 탐색, 확인, 존재여부를 쉽게 파악하기 위한 규칙
        - 주로 데이터 분석과 같은 분야에서 사용
        - 웹 => password, 첨부파일, 회원가입 규칙 등 ...
        - 다른 언어에서도 정규표현식은 동일
    -->
    <!-- 
        /regExp/flag => /     / => 패턴의 시작과 끝
        regExp : 패턴, flag: 옵션

        -('str').match(/regexp/) : str에서 매칭되는 항목들을 배열로 리턴
        -('str').replace(/regexp/ , 'changeStr') : str 문자열이 정규식에 맞는지 체크
            => true가 되면 바꿀 문자로 변경 (최초 1개)
        -('str').split(/regexp/): 정규식에 매칭되는 항목을 기준으로 str을 나누어 배열로 리턴
        -(/regexp/).test('str') : str 문자열이 정규식에 맞는지 체크 true / false
    -->
    <!-- 
        정규표현식에 사용되는 플래그
        i : 대소문자를 구분하지 않음
        g : 전역검색
        m : 줄바꿈을 포함

        패턴 문자열
        a-zA-Z : 영어 대소문자 / ㄱ-ㅎ가-휠: 한글 / 0-9: 숫자
        . : 모든 문자열(숫자, 한글, 영어, 특수문자, 공백) => 줄바꿈 x

        \d : 숫자       \D : 숫자가 아닌 것
        \s : 공백       \S : 공백이 아닌 것
        \w : 영숫자     \W : 영숫자 아닌 것
        \특수기호 

        검색패턴
        | or (jpg|gif|png)      [jpg] => g or p or g

        [] : or의 묶음 / 해당 문자들 중 하나

        /abc/ => 'abc'를 포함
        /[abc]/ => 'a', 'b', 'c' 중 하나를 포함
        /[a-z+]/ => a~z까지 중 하나를 포함하는(+ : 하나 이상)
        /[^abc]/ => 'a', 'b', 'c' 제외

        {min, max} : min~max까지 글자수 제한

        ^ => 시작문자 / $ => 끝문자

        - 그림파일만 허용 jpg, gif, png, bmp
        /^\.(jpg|gif|png|bmp)$/i 
    -->

    <script>
        let testStr = 'This is JavaScript Regualar Expression';
        console.log(testStr.match(/is/g));

        if(testStr.match(/is/g)){
            console.log('is true');
        } else {
            console.log('is empty');
        }

        console.log(/is/g.test(testStr));

        const fileName = ['abc.jpg', 'main.java', 'main.GIF', 'test.gif', 'doc.pdf', 'code.js'];
        // 이미지파일: abc.jpg, main.GIF, test.gif
        // 그 외: main.java, doc.pdf, code.js

        const imageFiles = [];
        const otherFiles = [];

        // for(let i = 0; i < fileName.length; i++){
        //     if(/\.(jpg|gif|png|bmp)$/i.test(fileName[i])){
        //         imageFiles.push(fileName[i]);
        //     } else {
        //         otherFiles.push(fileName[i]);
        //     }
        // }

        fileName.forEach((file) => {
            file.match(/\.(jpg|gif|png|bmp)$/i) ? imageFiles.push(file) : otherFiles.push(file);
        });

        console.log(imageFiles);
        console.log(otherFiles);

        // console.log(imageFiles);
        // console.log(otherFiles);

   </script>
</body>
</html>
