<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>looflex_시리즈</title>
    <link rel="stylesheet" href="../css/common/looflex_common.css">
    <link rel="stylesheet" href="../css/common/looflex_modal.css">
    <link rel="stylesheet" href="../css/looflex_series.css">

    <link rel="icon" href="../resource/img/looflex_logo_ico.png">
</head>
<body>
    <script src="../js/common/config.js" defer></script>
    <script src="../js/looflex_series.js" defer></script>
    <script src="../js/common/looflex_header.js" defer></script>
    <script src="../js/common/looflex_detail_modal.js" defer></script>


    <!-- HEADER -->
    <div class="header">
        <div class="logo" onclick="location.href='../html/looflex_Main.html'">
            <img src="../resource/img/looflex_logo.png" alt="">
        </div>
        <div class="category">
            <div onclick="location.href='../html/looflex_allMovies.html'">영화</div>
            <div style="color: #F6F6F6;" onclick="location.href='../html/looflex_series.html'">시리즈</div>
            <div class="genres">장르<img src="../resource/img/down_arrow.png" alt="">
                <div class="genres-drop">
                    
                </div>
            </div>
        </div>
        <div class="search-bar">
            <input type="text" class="search-input">
            <div class="search-icon">
                <div class="search-icon-img"></div>
            </div>
        </div>
        <div class="my-page-box">
            <button>마이페이지</button>
        </div>
    </div>

    <!-- CONTAINER -->
    <div class="container">
        <div class="inner">
            <div class="collections-title">
                <img src="../resource/img/looflex_logo_ico.png"> 인기작 시리즈 TOP 10
                <div class="col-sub">지금 명작 영화 시리즈들을 만나보세요!</div>
            </div>
            <div class="collections-box">
                <div class="collections">
                    <div class="col-top">
                        <div class="marvel" onclick="fetchSeriesMovies('marvel')"></div>
                        <div class="harrypotter" onclick="fetchSeriesMovies('harrypotter')"></div>
                        <div class="fastandfurious" onclick="fetchSeriesMovies('fastandfurious')"></div>
                        <div class="starwars" onclick="fetchSeriesMovies('starwars')"></div>
                        <div class="dc_universe" onclick="fetchSeriesMovies('dc_universe')"></div>
                    </div>
                    <div class="col-bottom">
                        <div class="lordoftherings" onclick="fetchSeriesMovies('lordoftherings')"></div>
                        <div class="johnwick" onclick="fetchSeriesMovies('johnwick')"></div>
                        <div class="missionimpossible" onclick="fetchSeriesMovies('missionimpossible')"></div>
                        <div class="jamesbond" onclick="fetchSeriesMovies('jamesbond')"></div>
                        <div class="matrix" onclick="fetchSeriesMovies('matrix')"></div>
                    </div>
                </div>
                <div class="inventory">
                    
                </div>
            </div>
        </div>
    </div>
    
    <!-- FOOTER -->
            <div class="bottom">
                <div class="inner">
                    <div class="footer-box">
                        <div class="footer-top">
                            <div>루플렉스 서비스 이용약관</div>
                            <div>개인정보 처리 방침</div>
                            <div>청소년 보호정책</div>
                            <div>채용정보</div>
                        </div>
                        <div class="footer-middle">
                            <div><div>고객센터</div><span>FAQ · cs@looflex.com</span></div>
                            <div><div>광고 문의</div><span>ad-sales@looflex.com</span></div>
                            <div><div>제휴 및 대외 협력</div><span>https://looflex.team/contact</span></div>
                            <div><div>큐레이터</div><span>큐레이터 이용 가이드</span></div>
                        </div>
                        <div class="footer-bottom">
                            <div class="bottom-top">
                                <div>주식회사 looflex</div>
                                <div>대표 OOO</div>
                                <div>200 Park Ave, New York, NY 10166, USA</div>
                            </div>
                            <div>사업자번호 0000-0000-0000-0000</div>
                            <div>호스팅 서비스 제공자 looflex</div>
                        </div>
                    </div>
                </div>
            </div>

    <!-- MODAL -->

            <div class="modal">
                <div class="modal-content">
                    <div onclick="modalClose()" class="close"></div>
                    <div class="modal-details">

                    </div>
                </div>
            </div>

    <div class="top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <div class="top-img"></div>
    </div>
</body>
</html>
