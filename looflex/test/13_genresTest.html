<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="genre-title"></div>
    <div class="container">

    </div>

    <script>
        const posterUrl = "https://image.tmdb.org/t/p/";

        const options = {
            method: 'GET',
            headers: {
                accept: 'application/json',
                Authorization: 'Bearer eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIxYjExN2NlZmMwY2Y0YWQ0ZGUwMzA4MDA3MzlmY2U0YiIsIm5iZiI6MTc3OTc2MDUwOC45MDQsInN1YiI6IjZhMTRmZDdjODdjZTExYjc4OTQwZTNkNiIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.h09fsP3yiOtN0WcPdjzEQVEuoSheGw8oxt-aUMLUGFU' // 본인의 API 키를 입력하세요
            }
        };

        const container = document.querySelector(".container");
        const title = document.querySelector(".genre-title");
        let conHTML = '';

        const showid = async (genresId) => {
            const [movieRes, genreRes] = 
            await Promise.all([
                fetch(`https://api.themoviedb.org/3/discover/movie?with_genres=${genresId}&sort_by=popularity.desc&language=ko&page=1`, options),
                fetch(`https://api.themoviedb.org/3/genre/movie/list?language=ko`, options)
            ]);

            const movieData = await movieRes.json();
            const genreData = await genreRes.json();

            const currentGenre = genreData.genres.find(g => g.id == genresId);
            const genreName = currentGenre ? currentGenre.name : "알 수 없는 장르";

            const result = movieData.results;

            title.innerText = genreName;

            result.forEach((re) => {
                console.log(re)
                conHTML += `
                    <div class="element">
                        <div>
                            <img src="${posterUrl}w200${re.poster_path}">
                            <div>${re.title}</div>
                        </div>
                    </div>
                `
            })

            container.innerHTML = conHTML;
        };

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const genreName = urlParams.get('genres');

            showid(genreName);
        };
    </script>
</body>
</html>
