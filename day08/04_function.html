<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>function</title>
</head>
<body>
    <h1>function 함수</h1>
    <h3>- 특정 기능을 수행하기 위해 작성한 코드</h3>

    <!-- 
        - 함수는 호출되어야 실행
        - 자바의 method처럼 호출
        - 자바에서는 class -> method 생성 -> 객체 생성 -> 호출
        - 자바스크립트에서는 어디서든 function 생성 가능 -> 호출

        function 함수명(파라미터){
            console.log(파라미터);
            로직;
            return 값;
        }

        - 함수명 : 기능을 함축적으로 작성
        - 파라미터(매개변수) : 없어도 ()는 생략 불가능
        - JS는 파라미터의 자유도가 높음
        - return : 함수 종료의 역할과 동시에 특정 결과값을 호출한 위치로 반환
    -->

    <script src="../day08/01_script.js"></script>
    <script>
        function myFirstFunc(){
            console.log("HELLO!");
        }

        myFirstFunc(); // 함수호출 => 내 파일 내에서는 호이스팅 가능
        mySecondFunc(); // 외부파일은 호출 우선

        function call(name){
            console.log(`my name is ${name}`);
        }

        call("peter parker");

        // num1, num2 두 수를 파라미터로 받아 두 수의 합을 콘솔에 출력

        function sum(num1, num2) {
            console.log(num1 + num2);
        }

        sum(3, 4);

        const sum01 = (num1, num2) => {
            console.log(num1 + num2)
        };

        sum01(4, 9);

    </script>
    
</body>
</html>
