<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>function04</title>
</head>
<body>
    <h1>화살표 함수(ES6)</h1>
    <!-- 
        - 가독성이 떨어지나 코드량을 줄일 수 있음.
        - 표현식 함수와 같이 변수화 가능
    -->

    <script>
        const arrowFunc = (p1, p2) => {
            let result = p1 + p2;
            return result;
        }

        console.log(arrowFunc(30, 40));

        // 리턴만 있을 때
        const arrowFunc02 = (p1, p2) => (p1 + p2);
        const arrowFunc03 = (p1, p2) => {return p1 + p2};
        console.log(arrowFunc02(60, 70), arrowFunc03(60, 70));

        // 리턴이 없을 때 { } 필수
        
    </script>
</body>
</html>
