<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dataType</title>
</head>
<body>
    <h1>dataType</h1>
    <h3>변수나 상수에 할당할 수 있는 값의 종류</h3>
    <!-- 
        숫자 : number => 정수, 실수, NaN(Not a Number : 숫자가 아님)
        문자 : string => "", '', `` 안에 들어있는 값
        boolean : boolean => true, false
        객체 : object => 1개 이상의 데이터가 특정한 구조를 가지고 있는 형태
                {키 : 값} {} : 아무것도 없는 객체도 1개의 객체로 취급
        배열 : array => [1,2,3,4] => java에서의 list와 비슷한 형태 index, length를 가진다
        미지정값 : undefined
    -->
    
    <script>
        let num = 123;
        let str = 'abc';
        let bool = true;
        let obj = {
            name: 'hong',
            age: 20,
            fList: [1, 2, 3],
            fObj: {
                key: 'value'
            }
        };
        let obj2 = new Object(); // js에서 제공하는 내장 객체
        let arr = [1, 2, 'a', 'b', [3, 4, 5], {}];
        let undi = undefined;

        console.log(typeof num);
        console.log(typeof str);
        console.log(typeof bool);
        console.log(typeof obj);
        console.log(typeof obj2);
        console.log(typeof arr);
    </script>

    <!-- 
        기본 자료형 : 값이 메모리에 직접 할당
            number, boolean, string(참조자료형이지만 편의상 기본자료형처럼 쓰임)
        참조 자료형 : 값이 저장되어 있는 주소
            string, array, object, function, null . . .

        == 같다 != 같지않다  => 값만 비교
        123 == '123' true
        === 같다 !== 같지않다 => 값 + 타입 비교
        123 === '123' false
    -->
        <script>
            let num1 = 10;
            let num2 = '10';

            console.log(num1 == num2);
            console.log(num1 === num2);
        </script>
</body>
</html>
